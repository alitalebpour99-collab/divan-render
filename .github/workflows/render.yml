name: Render

# Divan's Reels and Stories, drawn on GitHub's machines.
#
# This repository is a copy of the folder video/ of Divan's own (private)
# repository, made public so that the drawing costs nothing: GitHub runs public
# repositories' jobs for free. Nothing secret is in it; the one secret, the
# key the site asks for, lives in this repository's Actions secrets.
#
# The job is worker.mjs in one pass: it asks the site what waits
# (`/api/social/work`), draws it, hands the MP4 and the tile back, and ends.
# It looks every quarter of an hour. A look that finds nothing ends after a few
# seconds, before anything is installed, and a public repository's runs cost
# nothing, so the many looks are free. They are many on purpose: GitHub starts
# a scheduled run late, or now and then not at all (on 16 October the first
# run of the day's five fixed hours had not come forty minutes after its
# time). With a look every fifteen minutes a missed one costs a quarter of an
# hour, and a Reel is still drawn hours before its hour (Tehran 12:30 and
# 19:30, that is 09:00 and 16:00 UTC), a Story soon after its Reel is posted.
#
# GitHub switches off the schedule of a public repository in which nothing
# happened for sixty days. On the first of each month the job «alive» makes an
# empty commit, so the schedule never lapses while the copy of video/ rests.

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
    - cron: "41 3 1 * *"

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alive:
    if: github.repository == 'alitalebpour99-collab/divan-render' && github.event.schedule == '41 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the schedule alive"
          git push

  render:
    # a copy of this repository has no key and nothing to draw; the monthly «alive» run draws nothing
    if: github.repository == 'alitalebpour99-collab/divan-render' && github.event.schedule != '41 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DIVAN_URL: https://divan.ahura.cloud
      DIVAN_RENDER_SECRET: ${{ secrets.DIVAN_RENDER_SECRET }}
    steps:
      - name: Anything to draw?
        id: look
        run: |
          n=$(curl -fsS --retry 3 --retry-delay 5 -H "authorization: Bearer $DIVAN_RENDER_SECRET" "$DIVAN_URL/api/social/work?peek=1&can=story" | jq -r '.waiting // 0')
          echo "waiting: $n"
          echo "waiting=$n" >> "$GITHUB_OUTPUT"

      - if: steps.look.outputs.waiting != '0'
        uses: actions/checkout@v4

      - if: steps.look.outputs.waiting != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.look.outputs.waiting != '0'
        name: The libraries Chrome Headless Shell needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 || sudo apt-get install -y -qq --no-install-recommends libasound2
          # ffmpeg: every Reel is brought to one loudness and checked before it is handed back (worker.mjs, finish)
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - if: steps.look.outputs.waiting != '0'
        run: npm ci --no-audit --no-fund

      - if: steps.look.outputs.waiting != '0'
        name: The browser and the bundle
        run: |
          node -e "import('@remotion/renderer').then((m) => m.ensureBrowser())"
          node build.mjs

      - if: steps.look.outputs.waiting != '0'
        name: Draw what waits, hand it back
        env:
          RENDER_GL: swangle
        run: node worker.mjs
