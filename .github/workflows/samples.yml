name: Samples

# Renders Reels from the files in samples/ (content the site's own builders
# wrote, scripts/social-samples.mjs in Divan's repository) and keeps the videos
# and their tiles as the run's artifact: for looking at a new format, or a
# changed one, before it goes onto the page. Nothing is sent to the site.
#
# `list` is pairs of «composition:sample file without .json», separated by
# spaces, for example «arsenal:arsenal-tank figure:figure-inflation». A
# carousel («cards:cards-dollar») comes out as one picture per card.

on:
  workflow_dispatch:
    inputs:
      list:
        description: "composition:sample pairs"
        required: true
        default: "decision:decision-oil"

permissions:
  contents: read

jobs:
  samples:
    if: github.repository == 'alitalebpour99-collab/divan-render'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The libraries Chrome Headless Shell needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 || sudo apt-get install -y -qq --no-install-recommends libasound2
          # ffmpeg: every Reel is brought to one loudness and checked before it is handed back (worker.mjs, finish)
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: The browser and the bundle
        run: |
          node -e "import('@remotion/renderer').then((m) => m.ensureBrowser())"
          node build.mjs
      - name: Render every pair, and its tile
        # a sample that stalls ends here, not after the job's hours
        timeout-minutes: 25
        env:
          LIST: ${{ inputs.list }}
          # a sample is for looking: the gate reports (out/<name>.gate.json) and the run goes on
          DIVAN_GATE: warn
        run: |
          for pair in $LIST; do
            comp="${pair%%:*}"; name="${pair#*:}"
            echo "== $comp from samples/$name.json"
            if [ "$comp" = "cards" ]; then node render.mjs cards --props "samples/$name.json" --bundle bundle --still all --out "$name"; continue; fi
            # with the narrator's lines when the sample has them (samples/<name>.voice.json, as lib/social/voice.ts makes them)
            voice=""; if [ -f "samples/$name.voice.json" ]; then voice="--voice samples/$name.voice.json"; fi
            node render.mjs "$comp" --props "samples/$name.json" --bundle bundle --out "$name" $voice
            # for looking without downloading the master: a small copy, a sheet of two frames a second, the loudness, the gate's report
            mkdir -p small
            ffmpeg -v error -y -i "out/$name.mp4" -vf scale=360:-2 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k "small/$name-360.mp4"
            ffmpeg -v error -y -i "out/$name.mp4" -vf "fps=2,scale=216:-2,tile=10x6:padding=4:color=0x000000" -q:v 4 "small/$name-sheet-%02d.jpg"
            ffmpeg -hide_banner -nostats -i "out/$name.mp4" -vn -af ebur128=peak=true -f null - 2>&1 | sed -n '/Summary:/,$p' > "small/$name-loudness.txt"
            if [ -f "out/$name.gate.json" ]; then cp "out/$name.gate.json" small/; fi
            # the storyboard engine: the storyboard, the quality gate, the one-frame-a-second sheet the judge scores
            for f in "out/$name.storyboard.json" "out/$name.qa.json" "out/$name-sheet-1fps.jpg"; do if [ -f "$f" ]; then cp "$f" small/; fi; done
            if [ -f "samples/$name.cover.json" ]; then node render.mjs cover --props "samples/$name.cover.json" --bundle bundle --still 0 --out "$name-tile"; ffmpeg -v error -y -i "out/$name-tile-0000.png" -vf scale=540:-2 -q:v 3 "small/$name-tile.jpg" || true; fi
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: small
          path: small/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: out/
          retention-days: 7
