name: Tests

# The storyboard engine, the map engine's pure parts and the loop's seam and layout (tests/), without a browser
# and without ffmpeg: a few seconds on every push and pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'alitalebpour99-collab/divan-render'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # TypeScript read by Node with its own type stripping; d3-geo and topojson-client are the only packages needed
      - run: npm install --no-save --no-audit --no-fund d3-geo@3.1.1 topojson-client@3.1.0
      - run: node --import ./tests/register.mjs --test tests/storyboard.test.mjs tests/seam.test.mjs tests/loop.test.mjs
